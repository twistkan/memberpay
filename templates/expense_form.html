{% extends "base.html" %}{% block title %}{{ 'Edit' if expense_id else 'Record' }} Expense{% endblock %}
{% block content %}<div class="page-wrap"><div class="page-head"><div><h1>{{ 'Edit' if expense_id else 'Record' }} expense</h1><p>Record money spent by the circle.</p></div></div><form method="post" class="card"><div class="form-grid"><label>Description<input name="description" value="{{ data.description }}" maxlength="200" required></label><label>Amount (UGX)<input name="amount" value="{{ data.amount }}" inputmode="numeric" required></label><label>Date spent<input type="date" name="spent_date" value="{{ data.spent_date }}" required></label><label>Category<select name="category">{% for category in categories %}<option {% if category == data.category %}selected{% endif %}>{{ category }}</option>{% endfor %}</select></label><label>Paid to<input name="payee" value="{{ data.payee }}" maxlength="200"></label><label>Payment method<select name="method">{% for method in ['Cash','Mobile Money','Bank Transfer','Other'] %}<option {% if method == data.method %}selected{% endif %}>{{ method }}</option>{% endfor %}</select></label></div><label style="margin-top:16px">Notes<textarea name="notes" maxlength="4000">{{ data.notes }}</textarea></label><div class="form-actions"><a class="button ghost" href="{{ url_for('expenses') }}">Cancel</a><button class="button primary">Save Expense</button></div></form></div>{% endblock %}
