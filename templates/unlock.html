<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Unlock · MemberPay</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body class="unlock-page"><section class="unlock-card"><img class="unlock-logo" src="{{ url_for('group_logo') }}" alt="Group logo"><div class="eyebrow">{{ circle_name }}</div><h1>Welcome to MemberPay</h1><p class="muted">Your private, on-device payment tracker.</p>{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}<div class="flash danger">{{ messages[-1][1] }}</div>{% endif %}{% endwith %}<form method="post"><label>Shared password<input type="password" name="password" autofocus required placeholder="Enter password"></label><button class="button primary wide" type="submit">Unlock MemberPay <span>→</span></button><p class="powered-by">Powered by Twist</p></form><p class="privacy-note"><span>●</span> Stored locally on this computer · No internet required</p></section></body></html>
