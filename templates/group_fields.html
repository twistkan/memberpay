<div class="form-grid">
<label>Group name<input name="circle_name" value="{{ request.form.get('circle_name', circle_name if circle_name != 'Your group' else '') }}" maxlength="120" required placeholder="Your group’s name"></label>
<label>Motto (optional)<input name="group_motto" value="{{ request.form.get('group_motto', group_motto) }}" maxlength="200"></label>
<label>Group start date<input type="date" name="circle_start_date" value="{{ request.form.get('circle_start_date', circle_start if rules_locked or request.endpoint != 'onboarding' else '') }}" required {% if rules_locked %}readonly{% endif %}></label>
<label>Dues begin{% if rules_locked %}<input type="hidden" name="dues_policy" value="{{ dues_policy }}"><input value="{{ 'Group’s starting month' if dues_policy == 'shared' else 'Member’s joining month' }}" readonly>{% else %}<select name="dues_policy" required><option value="">Choose a rule…</option><option value="shared" {% if request.form.get('dues_policy', dues_policy if request.endpoint != 'onboarding' else '') == 'shared' %}selected{% endif %}>Group’s starting month, including later joiners</option><option value="joining" {% if request.form.get('dues_policy', dues_policy if request.endpoint != 'onboarding' else '') == 'joining' %}selected{% endif %}>Member’s joining month, no earlier than group start</option></select>{% endif %}</label>
<label>Default registration fee<input name="default_registration" type="number" min="0" max="1000000000000" step="1" value="{{ request.form.get('default_registration', default_registration if request.endpoint != 'onboarding' else '') }}" required></label>
<label>Default monthly contribution<input name="default_monthly" type="number" min="1" max="1000000000000" step="1" value="{{ request.form.get('default_monthly', default_monthly if request.endpoint != 'onboarding' else '') }}" required></label>
<label>Currency<select name="currency"><option value="UGX">UGX — Ugandan shillings (whole amounts)</option></select><span class="help">This edition supports UGX. Existing amounts are never converted.</span></label>
<label>Group logo (optional)<input name="logo" type="file" accept="image/png,image/jpeg"><span class="help">PNG or JPEG, up to 2 MB. A MemberPay mark is used otherwise.</span></label>
</div>
{% if request.endpoint != 'onboarding' %}<label><input type="checkbox" name="remove_logo" value="yes" style="width:auto"> Use the generic MemberPay logo</label>{% endif %}
<p class="help">Example: if the group starts in June and a member joins in August, “Group’s starting month” counts June, July and August. “Member’s joining month” starts in August. Payments cover the oldest unpaid month first.</p>
