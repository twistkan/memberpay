{% extends "base.html" %}{% block title %}Edit Payment{% endblock %}
{% block content %}<div class="page-wrap"><div class="page-head"><div><div class="eyebrow">CORRECT A PAYMENT</div><h1>Edit payment</h1><p>Fix the amount, date, method, notes, or payment type for {{ payment.name }}.</p></div></div><section class="section-card"><form method="post" style="padding:21px"><div class="form-grid"><label>What is this payment for?<select name="payment_type"><option value="monthly" {% if payment.payment_type == 'monthly' %}selected{% endif %}>Monthly Contribution</option><option value="registration" {% if payment.payment_type == 'registration' %}selected{% endif %}>Registration Fee</option></select></label><label>Amount (UGX)<input type="number" name="amount" min="1" step="1" value="{{ payment.amount }}" required></label><label>Payment date<input type="date" name="paid_date" value="{{ payment.paid_date }}" required></label><label>Method<select name="method">{% for method in ['Cash','Mobile Money','Bank Transfer','Other'] %}<option {% if payment.method == method %}selected{% endif %}>{{ method }}</option>{% endfor %}</select></label><label style="grid-column:span 2">Notes<input name="notes" value="{{ payment.notes }}"></label></div><div class="form-actions"><a class="button danger" data-confirm="Delete this payment permanently?" href="{{ url_for('delete_payment', payment_id=payment.id) }}" onclick="event.preventDefault(); if(confirm(this.dataset.confirm)){ const f=document.createElement('form');f.method='post';f.action=this.href;document.body.appendChild(f);f.submit(); }">Delete</a><a class="button ghost" href="{{ url_for('member_detail', member_id=payment.member_id) }}">Cancel</a><button class="button primary" type="submit">Save changes</button></div></form></section></div>{% endblock %}
